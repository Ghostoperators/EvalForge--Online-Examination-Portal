<center>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="enroll" placeholder="Enrollment Number" required><br>
        <input type="text" name="loginid" placeholder="Login ID" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="text" name="contact" placeholder="Contact" required><br>
        <button type="submit">Sign Up</button>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}
    </form>

    <h6>Already have an account? <a href="{% url 'Student_login' %}">Login</a></h6>
</center>
